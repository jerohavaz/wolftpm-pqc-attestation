name: wolftpm-development

x-wolftpm-build: &wolftpm-build
  context: .
  args:
    WOLFSSL_VERSION: ${WOLFSSL_VERSION:-5.9.2}

services:
  tpm:
    build:
      <<: *wolftpm-build
      target: simulator
    ports:
      - "127.0.0.1:${TPM_COMMAND_PORT:-2321}:2321"
      - "127.0.0.1:${TPM_PLATFORM_PORT:-2322}:2322"
    volumes:
      - tpm-state:/var/lib/wolftpm
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/fwtpm-ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 2s
    restart: unless-stopped

  app:
    profiles: ["app"]
    build:
      <<: *wolftpm-build
      target: app
    environment:
      TPM2_SWTPM_HOST: tpm
      TPM2_SWTPM_PORT: "2321"
    depends_on:
      tpm:
        condition: service_healthy

  dev:
    profiles: ["dev"]
    build:
      <<: *wolftpm-build
      target: dev
    environment:
      TPM2_SWTPM_HOST: tpm
      TPM2_SWTPM_PORT: "2321"
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    depends_on:
      tpm:
        condition: service_healthy
    init: true

volumes:
  tpm-state:
